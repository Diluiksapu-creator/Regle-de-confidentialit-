<title>Règles de confidentialité / Privacy Policies</title>
<style>
  :root { --bg:#ffffff; --text:#1d2330; --dim:#5b6474; --line:#e3e6ec; --acc:#0b7f7a; }
  @media (prefers-color-scheme:dark) { :root { --bg:#0E0F10; --text:#EDEDED; --dim:#99999E; --line:#2a2a2c; --acc:#4CE8E0; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:26px; line-height:1.2; margin:0 0 4px; }
  .dim { color:var(--dim); margin:0 0 24px; }
  ul { list-style:none; padding:0; margin:0; }
  li { border-top:1px solid var(--line); padding:14px 0; }
  li:last-child { border-bottom:1px solid var(--line); }
  a { color:var(--acc); font-weight:600; text-decoration:none; }
  a:hover { text-decoration:underline; }
</style>
</head>
